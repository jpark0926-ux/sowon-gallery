<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>박소원 개인전</title>
<style>
  :root { color-scheme: light; --bg:#f7f7f5; --ink:#111; --muted:#6b6b6b; --soft:#9a9a9a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
    overflow:hidden; -webkit-font-smoothing:antialiased; }
  body { opacity:0; transition:opacity .9s ease; }
  body.ready { opacity:1; }

  .chrome { position:fixed; inset:0; pointer-events:none; z-index:5;
    display:flex; flex-direction:column; justify-content:space-between;
    padding: clamp(18px, 3.2vh, 36px) 20px clamp(18px, 3vh, 32px); }
  header { text-align:center; pointer-events:none; }
  header .brand { font-size: clamp(15px, 2.1vw, 18px); letter-spacing:0.02em; color:#222; }
  header .brand b { font-family: system-ui,-apple-system,"Helvetica Neue",sans-serif;
    font-weight:800; letter-spacing:-0.02em; margin-left:2px; }
  header h1 { margin:6px 0 0; font-size: clamp(22px, 3.4vw, 30px); font-weight:600; letter-spacing:-0.01em; }

  #stage { position:fixed; inset:0; z-index:1; cursor:grab; touch-action:none; }
  #stage:active { cursor:grabbing; }
  #stage canvas, #stage > div { outline:none; }

  .card { width: var(--w); user-select:none; -webkit-user-select:none; }
  .card .frame { position:relative; background:#fff; border-radius:1px; overflow:hidden; }
  .card img { display:block; width:100%; height:auto; pointer-events:none; -webkit-user-drag:none; }
  .card .play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:54px; height:54px; border-radius:50%; border:0; cursor:pointer; pointer-events:auto;
    background:rgba(15,15,15,.72); color:#fff; display:grid; place-items:center;
    box-shadow:0 10px 28px rgba(0,0,0,.25); transition: transform .2s ease, background .2s ease;
    backdrop-filter: blur(4px); }
  .card .play:hover { background:rgba(0,0,0,.88); transform:translate(-50%,-50%) scale(1.06); }
  .card .play svg { width:22px; height:22px; margin-left:2px; }
  .meta { margin-top:12px; text-align:left; color:#4a4a4a; max-width:100%; }
  .meta .title { font-style:italic; font-size:13.5px; line-height:1.35; color:#222; }
  .meta .artist { font-size:12.5px; margin-top:3px; color:#333; }
  .meta .rest { font-family: system-ui,-apple-system,sans-serif; font-size:11px; color:var(--soft); margin-top:2px; letter-spacing:0.01em; }

  .statement { max-width:560px; margin:0 auto; text-align:center; pointer-events:auto;
    transform: translateY(18px); opacity:0; transition: opacity 1s ease .35s, transform 1s ease .35s; }
  body.ready .statement { opacity:1; transform:none; }
  .statement .kicker { font-size: clamp(17px, 2.4vw, 22px); font-weight:600; margin-bottom:10px; letter-spacing:-0.01em; }
  .statement p { margin:0 auto 16px; max-width:480px; font-size:13.5px; line-height:1.65; color:#555;
    font-family: system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  .cta { display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:#111; color:#fff; border:0; border-radius:999px; padding:12px 26px;
    font-family: system-ui,-apple-system,sans-serif; font-size:13.5px; cursor:pointer;
    transition: transform .2s ease, background .2s ease; pointer-events:auto; }
  .cta:hover { background:#000; transform:translateY(-1px); }

  .hint { position:fixed; right:16px; bottom:12px; z-index:6;
    font-family: system-ui,sans-serif; font-size:11px; color:#bcbcbc; pointer-events:none; }

  .modal { position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(8,8,8,.72); backdrop-filter:blur(8px); padding:24px; }
  .modal.open { display:flex; }
  .modal-inner { width:min(920px, 96vw); aspect-ratio:16/9; background:#000; border-radius:10px;
    overflow:hidden; position:relative; box-shadow:0 30px 80px rgba(0,0,0,.45); }
  .modal iframe { width:100%; height:100%; border:0; display:block; }
  .modal .close { position:absolute; top:-42px; right:0; background:transparent; border:0; color:#fff;
    font-size:28px; cursor:pointer; line-height:1; }

  @media (max-width:720px) {
    .meta .title { font-size:12px; }
    .meta .artist, .meta .rest { font-size:11px; }
    .statement p { font-size:12.5px; }
  }
</style>
</head>
<body>
  <div id="stage" aria-label="작품 갤러리"></div>

  <div class="chrome">
    <header>
      <div class="brand">SOWON × <b>박소원</b></div>
      <h1>박소원 개인전</h1>
    </header>
    <div class="statement">
      <div class="kicker" id="titleLine">박소원의 그림 이야기</div>
      <p id="descLine">시련 속에서도 서로를 붙잡고, 천국을 향한 길을 그려 온 작품들입니다. 드래그하거나 스크롤해 작품을 둘러보세요.</p>
      <button class="cta" type="button" id="guestBtn">방명록 남기기</button>
    </div>
  </div>

  <div class="hint">드래그 · 스크롤 · ← →</div>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-inner">
      <button class="close" id="modalClose" aria-label="닫기">×</button>
      <iframe id="yt" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

const works = [
  {
    src: '01.jpg', w: 1095, h: 1400,
    title: '살아남기여 시련이 있어도 포기하지 말아라',
    artist: '박소원', year: '2024', medium: 'Acrylic on canvas',
    desc: '만화 ‘살아남기’ 시리즈처럼, 시련 속에서도 서로 의지하며 포기하지 말라는 마음을 담았습니다.',
    yt: 'tapZEtdxjQw'
  },
  {
    src: '02.jpg', w: 1400, h: 1119,
    title: '천국을 가는 길엔 고난이 있다',
    artist: '박소원', year: '2024', medium: 'Acrylic on canvas',
    desc: '천국으로 향하는 우리 가족의 모습. 고난을 이겨내면 영원한 생명을 얻을 수 있다는 믿음을 그렸습니다.',
    yt: 'IsNtCH_TBU4'
  },
  {
    src: '03.jpg', w: 1387, h: 1400,
    title: '소원의 스위트 데이',
    artist: '박소원', year: '2024', medium: 'Marker on canvas',
    desc: '하트 모양 캔버스에 담긴 하루의 기록. 달콤하고 따뜻한 순간들을 모아 두었습니다.'
  },
  {
    src: '04.jpg', w: 680, h: 1400,
    title: '나의 인생 시계',
    artist: '박소원', year: '2023', medium: 'Mixed media',
    desc: '거대한 손목시계 형태의 설치 작품. 흘러가는 시간과 나의 이야기를 겹쳐 놓았습니다.'
  },
  {
    src: '05.jpg', w: 1084, h: 1400,
    title: '나의 자기소개서!',
    artist: '박소원', year: '2024', medium: 'Mixed media collage',
    desc: '기억과 취향, 손으로 만든 조각들을 모은 콜라주. 나를 소개하는 작은 전시입니다.'
  }
];

const N = works.length;
const ANGLE = (Math.PI * 2) / N;
const RADIUS = 520;
const CARD_MAX_H = 280;

const stage = document.getElementById('stage');
const titleLine = document.getElementById('titleLine');
const descLine = document.getElementById('descLine');
const modal = document.getElementById('modal');
const yt = document.getElementById('yt');
const modalClose = document.getElementById('modalClose');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 1, 3000);
camera.position.set(0, 18, 0);

const renderer = new CSS3DRenderer();
renderer.domElement.style.position = 'absolute';
renderer.domElement.style.inset = '0';
stage.appendChild(renderer.domElement);

const root = new THREE.Object3D();
scene.add(root);

const cards = [];
const playSvg = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>`;

function makeCard(work, index) {
  const scale = CARD_MAX_H / work.h;
  const width = Math.round(work.w * scale);
  const height = CARD_MAX_H;

  const el = document.createElement('div');
  el.className = 'card';
  el.style.setProperty('--w', width + 'px');
  el.innerHTML = `
    <div class="frame" style="width:${width}px">
      <img src="${work.src}" width="${width}" height="${height}" alt="${work.title}" draggable="false" />
      ${work.yt ? `<button class="play" type="button" data-yt="${work.yt}" aria-label="영상 재생">${playSvg}</button>` : ''}
    </div>
    <div class="meta">
      <div class="title">${work.title}</div>
      <div class="artist">${work.artist}</div>
      <div class="rest">${work.year} · ${work.medium}</div>
    </div>
  `;

  const obj = new CSS3DObject(el);
  const theta = index * ANGLE;
  obj.position.set(Math.sin(theta) * RADIUS, 0, Math.cos(theta) * RADIUS);
  obj.rotation.y = theta;
  root.add(obj);
  cards.push({ obj, work, el });

  const play = el.querySelector('.play');
  if (play) {
    play.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
    play.addEventListener('click', (e) => {
      e.stopPropagation();
      openVideo(work.yt);
    });
  }
}

works.forEach(makeCard);

let rot = 0;
let vel = 0;
let dragging = false;
let lastX = 0;
let lastT = 0;
let intro = 1;
let settledIndex = 0;

function nearestIndex() {
  const turns = -rot / ANGLE;
  let i = Math.round(turns) % N;
  if (i < 0) i += N;
  return i;
}

function updateStatement(force = false) {
  const i = nearestIndex();
  if (!force && i === settledIndex && Math.abs(vel) < 0.002) return;
  settledIndex = i;
  const w = works[i];
  titleLine.textContent = w.title;
  descLine.textContent = w.desc;
}

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  const base = Math.max(780, Math.min(1100, w * 0.85));
  camera.position.z = base;
  camera.position.y = h < 700 ? 28 : 12;
  camera.lookAt(0, -10, 0);
}
window.addEventListener('resize', resize);
resize();

function tick() {
  if (intro > 0.001) {
    intro *= 0.925;
    if (intro < 0.001) intro = 0;
  }

  if (!dragging) {
    rot += vel;
    vel *= 0.935;
    if (Math.abs(vel) < 0.0012) {
      vel = 0;
      const target = -nearestIndex() * ANGLE;
      let d = target - rot;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      rot += d * 0.14;
      if (Math.abs(d) < 0.002) rot = target;
    }
  }

  const zoom = 1 + intro * 0.18;
  root.rotation.y = rot;
  root.position.y = Math.sin(performance.now() * 0.00035) * 2;
  root.scale.setScalar(zoom);

  updateStatement();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('.play')) return;
  dragging = true;
  lastX = e.clientX;
  lastT = performance.now();
  vel = 0;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const now = performance.now();
  const dt = Math.max(8, now - lastT);
  const delta = dx * 0.0055;
  rot += delta;
  vel = delta * (16 / dt);
  lastX = e.clientX;
  lastT = now;
});
const endDrag = () => { dragging = false; };
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const amp = Math.max(-48, Math.min(48, e.deltaY));
  vel += (amp > 0 ? 1 : -1) * 0.035 * Math.min(2.4, Math.abs(amp) / 18);
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') vel += 0.055;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') vel -= 0.055;
  if (e.key === 'Escape') closeVideo();
});

function openVideo(id) {
  yt.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
  modal.classList.add('open');
}
function closeVideo() {
  modal.classList.remove('open');
  yt.src = '';
}
modalClose.addEventListener('click', closeVideo);
modal.addEventListener('click', (e) => { if (e.target === modal) closeVideo(); });

document.getElementById('guestBtn').addEventListener('click', () => {
  alert('방명록은 곧 연결됩니다.');
});

rot = ANGLE * 0.55;
vel = -0.08;
updateStatement(true);
requestAnimationFrame(() => document.body.classList.add('ready'));
tick();
</script>
</body>
</html>
