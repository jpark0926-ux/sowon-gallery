<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>박소원 개인전</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#fff; font-family: "Iowan Old Style", "Apple Garamond", Palatino, "Times New Roman", serif; color:#111; overflow:hidden; }
  .stage { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:28px 16px 36px; }
  header { text-align:center; z-index:2; }
  header .en { font-size:14px; letter-spacing:0.08em; color:#666; margin-bottom:4px; }
  header h1 { margin:0; font-size:28px; font-weight:600; }
  .viewport { flex:1; width:100%; max-width:1100px; perspective:1200px; display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none; }
  .viewport:active { cursor:grabbing; }
  .cylinder { position:relative; width:220px; height:320px; transform-style:preserve-3d; transition: transform 0.05s linear; }
  .card { position:absolute; left:50%; top:50%; width:200px; margin-left:-100px; margin-top:-150px; transform-style:preserve-3d; }
  .card img { width:100%; height:240px; object-fit:contain; border-radius:2px; box-shadow:0 18px 40px rgba(0,0,0,.18); background:#fafafa; display:block; user-select:none; -webkit-user-drag:none; }
  .meta { margin-top:10px; text-align:left; }
  .meta .title { font-style:italic; font-size:13px; line-height:1.3; }
  .meta .artist { font-family: system-ui, -apple-system, sans-serif; font-size:12px; margin-top:2px; }
  .meta .rest { font-family: system-ui, -apple-system, sans-serif; font-size:11px; color:#888; }
  .note { max-width:560px; text-align:center; min-height:110px; z-index:2; }
  .note .date { font-size:18px; margin-bottom:8px; }
  .note p { margin:0 auto 14px; font-family: system-ui, -apple-system, sans-serif; font-size:13px; line-height:1.55; color:#444; max-width:480px; }
  .note .desc { font-size:12.5px; color:#333; max-height:72px; overflow:hidden; }
  .cta { display:inline-block; background:#111; color:#fff; border:0; border-radius:999px; padding:12px 28px; font-family: system-ui, -apple-system, sans-serif; font-size:14px; }
  .hint { position:fixed; bottom:12px; right:16px; font-family: system-ui, sans-serif; font-size:11px; color:#bbb; }
</style>
</head>
<body>
  <div class="stage">
    <header>
      <div class="en">SOWON</div>
      <h1>박소원 개인전</h1>
    </header>
    <div class="viewport" id="viewport">
      <div class="cylinder" id="cylinder"></div>
    </div>
    <div class="note">
      <div class="date" id="titleLine"></div>
      <p class="desc" id="descLine"></p>
      <button class="cta" type="button">방명록 남기기</button>
    </div>
  </div>
  <div class="hint">드래그 · 스크롤 · ←→</div>
<script>
const works = [
  { src:'01.jpg', title:'살아남기여 시련이 있어도 포기하지 말아라', artist:'박소원', year:'2024', medium:'Acrylic on canvas',
    desc:'만화 ‘살아남기’ 시리즈처럼, 시련 속에서도 서로 의지하며 포기하지 말라는 마음을 담았습니다.' },
  { src:'02.jpg', title:'천국을 가는 길엔 고난이 있다', artist:'박소원', year:'2024', medium:'Acrylic on canvas',
    desc:'천국으로 향하는 우리 가족의 모습. 고난을 이겨내면 영원한 생명을 얻을 수 있다는 믿음을 그렸습니다.' },
  { src:'03.jpg', title:'소원의 스위트 데이', artist:'박소원', year:'2024', medium:'Marker on canvas',
    desc:'하트 모양 캔버스에 담긴 하루의 기록.' },
  { src:'04.jpg', title:'나의 인생 시계', artist:'박소원', year:'2023', medium:'Mixed media',
    desc:'거대한 손목시계 형태의 설치 작품.' },
  { src:'05.jpg', title:'나의 자기소개서!', artist:'박소원', year:'2024', medium:'Mixed media collage',
    desc:'기억과 취향, 손으로 만든 조각들을 모은 콜라주.' },
];
const N = works.length;
const angleStep = 360 / N;
const radius = 340;
const cyl = document.getElementById('cylinder');
works.forEach((w,i)=>{
  const el = document.createElement('div');
  el.className = 'card';
  el.style.transform = `rotateY(${i*angleStep}deg) translateZ(${radius}px)`;
  el.innerHTML = `<img src="${w.src}" alt=""/><div class="meta"><div class="title">${w.title}</div><div class="artist">${w.artist}</div><div class="rest">${w.year} · ${w.medium}</div></div>`;
  cyl.appendChild(el);
});
let rot = 0, vel = 0, dragging=false, lastX=0, lastT=0;
const titleLine = document.getElementById('titleLine');
const descLine = document.getElementById('descLine');
function nearestIndex(){
  const norm = ((-rot % 360) + 360) % 360;
  return Math.round(norm / angleStep) % N;
}
function render(){
  cyl.style.transform = `translateZ(-80px) rotateY(${rot}deg)`;
  const i = nearestIndex();
  const w = works[i];
  titleLine.textContent = w.title;
  descLine.textContent = w.desc;
}
function tick(){
  if(!dragging){
    rot += vel;
    vel *= 0.92;
    if(Math.abs(vel)<0.02){
      vel = 0;
      const target = -nearestIndex()*angleStep;
      let d = target - rot;
      while(d>180) d-=360; while(d<-180) d+=360;
      rot += d*0.18;
      if(Math.abs(d)<0.15) rot = target;
    }
  }
  render();
  requestAnimationFrame(tick);
}
const vp = document.getElementById('viewport');
vp.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastT=performance.now(); vel=0; vp.setPointerCapture(e.pointerId); });
vp.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX - lastX;
  const now = performance.now();
  rot += dx * 0.35;
  vel = dx * 0.35 * (16/Math.max(8, now-lastT));
  lastX = e.clientX; lastT = now;
});
vp.addEventListener('pointerup', ()=>{ dragging=false; });
vp.addEventListener('pointercancel', ()=>{ dragging=false; });
vp.addEventListener('wheel', e=>{ e.preventDefault(); vel += (e.deltaY>0?1:-1)*1.8; }, {passive:false});
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){ vel += 2.2; }
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ vel -= 2.2; }
});
tick();
</script>
</body>
</html>
